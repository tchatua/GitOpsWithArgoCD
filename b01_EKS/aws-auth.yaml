apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapUsers: |
    - userarn: arn:aws:iam::088354478627:user/terraform
      username: terraform
      groups:
        - system:masters
  mapRoles: |
    - rolearn: arn:aws:iam::088354478627:role/default-eks-node-group-20251130192740305200000001
      username: system:node:{{EC2PrivateDNSName}}
      groups:
        - system:bootstrappers
        - system:nodes
